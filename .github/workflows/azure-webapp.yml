name: Deploy FastAPI Backend to Azure

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: community-helper-api-poushali
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Configure Azure App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            # Forces the CLI to lock onto your subscription before modifying app settings
            az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            az webapp config appsettings set \
              --resource-group medical_recommendation \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

            az webapp config set \
              --resource-group medical_recommendation \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --startup-file "gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app"

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./backend
          # Bypasses the root tenant check by deploying directly to this scope
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
