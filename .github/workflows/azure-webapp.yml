name: Deploy FastAPI Backend to Azure

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: community-helper-api-poushali
  AZURE_RESOURCE_GROUP: medical_recommendation
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies into package
        working-directory: backend
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            -r requirements.txt \
            --target .python_packages/lib/site-packages

          echo "Checking packaged dependencies..."

          test -f .python_packages/lib/site-packages/uvicorn/__init__.py
          test -f .python_packages/lib/site-packages/fastapi/__init__.py
          test -f .python_packages/lib/site-packages/gunicorn/__init__.py

          echo "Uvicorn package found:"
          ls -la .python_packages/lib/site-packages/uvicorn | head

          echo "FastAPI package found:"
          ls -la .python_packages/lib/site-packages/fastapi | head

          echo "Gunicorn package found:"
          ls -la .python_packages/lib/site-packages/gunicorn | head

      - name: Verify packaged dependencies
        working-directory: backend
        run: |
          export PYTHONPATH="$PWD/.python_packages/lib/site-packages"

          python -c "import uvicorn; print('Uvicorn:', uvicorn.__version__)"
          python -c "import fastapi; print('FastAPI:', fastapi.__version__)"
          python -c "import gunicorn; print('Gunicorn:', gunicorn.__version__)"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --settings \
                SCM_DO_BUILD_DURING_DEPLOYMENT=false \
                PYTHONPATH="/home/site/wwwroot/.python_packages/lib/site-packages"

            az webapp config set \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --startup-file "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./backend

